- type: reagent
  id: ADTSugarKnight
  name: sugar-knight-name
  parent: BaseAlcohol
  desc: sugar-knight-desc
  physicalDesc: reagent-physical-desc-sugary
  flavor: adt_sugarknight
  color: "#D36E70"
  metamorphicSprite:
    sprite: _ADT/Objects/Consumable/Drinks/sugarknight.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 5
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:AdjustReagent
        reagent: Ethanol
        amount: 0.1

